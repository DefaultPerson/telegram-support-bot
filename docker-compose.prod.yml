# Telegram Support Bot - Production
# Self-contained stack: the bot plus its Redis datastore.

services:
  support-bot:
    build:
      context: .
      args:
        INSTALL_AI: "1"
    container_name: hm-support-bot
    command: sh -c "cd /usr/src/app && python -m app"
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - ./redis/data:/data
