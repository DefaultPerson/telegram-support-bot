# Telegram Support Bot - Production
# Uses shared infrastructure: PostgreSQL (DATABASE_URL) + Redis (REDIS_*) over the
# private network. No bundled datastores — all connection config comes from env.

services:
  support-bot:
    build:
      context: .
      args:
        INSTALL_AI: "1"
    container_name: hm-support-bot
    command: sh -c "cd /usr/src/app && python -m app"
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Unhealthy once the heartbeat file (HEARTBEAT_FILE, rewritten every minute
    # while the Bot API answers) is older than 5 minutes. Empty HEARTBEAT_FILE
    # turns the heartbeat and this check off.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; p = os.environ.get('HEARTBEAT_FILE', '/tmp/bot-heartbeat').strip(); sys.exit(bool(p) and time.time() - os.path.getmtime(p) > 300)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
