# Example policy for the optional declarative engine.
#
# Enable it by setting in .env:
#   POLICY_ENABLED=true
#   POLICY_CONFIG_PATH=config/policy.yaml
#
# Copy this file to config/policy.yaml and adapt it. With POLICY_ENABLED=false
# (default) the engine is a no-op and the bot behaves exactly as without it.

version: 1

defaults:
  # Used when a template has no entry for the user's language.
  language_fallback: en

# Substituted into template texts via {name} placeholders.
variables:
  rules_url: "https://example.com/rules"

# Localized response texts referenced by auto_reply actions (template_key).
templates:
  rules_link:
    en: "Please read the rules first: {rules_url}"
    ru: "Пожалуйста, ознакомьтесь с правилами: {rules_url}"
  ask_clarify:
    en: "Could you elaborate? Your message is too short for us to help."
    ru: "Можете уточнить? Сообщение слишком короткое, чтобы помочь."

# Rules are evaluated top-to-bottom; actions of every matching rule are applied.
#
# Matchers (inside `when`):
#   event_type:     user_message | user_started | user_stopped | topic_created
#                   (a string or a list)
#   keywords_any:   list of substrings, or {min_matches: N, list: [...]}
#   regex:          a regular expression tested against the message text
#   message_length: {min: N, max: N}
#   has_link:       true|false (URL / t.me / @username presence)
#   all:            [clause, ...]  — every sub-clause must match
#   any:            [clause, ...]  — at least one sub-clause must match
#
# Actions:
#   suppress_topic_creation  — drop the first message, do not create a topic
#   suppress_group_notify    — do not post the lifecycle/topic notification
#   auto_reply               — send templates[template_key] to the user
#   set_tag                  — add {name} to the user's tags
#   close_topic              — close the forum topic
#   escalate                 — mark escalated and ping the developer
rules:
  # Do not spam the group with "started/stopped the bot" service notifications.
  - id: skip_lifecycle
    when:
      event_type: [user_started, user_stopped]
    actions:
      - type: suppress_group_notify

  # Ask very short, link-less first messages to elaborate.
  - id: too_short
    when:
      all:
        - event_type: user_message
        - message_length: { max: 10 }
        - has_link: false
    actions:
      - type: auto_reply
        template_key: ask_clarify

  # Point pricing questions at the rules.
  - id: price_question
    when:
      any:
        - regex: "(?i)\\b(price|cost|how much|сколько стоит|цена|стоимость)\\b"
    actions:
      - type: auto_reply
        template_key: rules_link

  # NOTE: business-development / partnership pitches are intentionally NOT
  # automated here — such messages may be valuable and should reach a human.

# Optional LLM layer. The real on/off switch is the AI_PROVIDER env var; this
# section only tunes behavior. `categories` is just a label set for the draft.
ai:
  enabled: false
  categories: [add_request, bd_pitch, complaint, price, other]
  draft_only_first_message: true
  system_prompt_path: config/system_prompt.txt
