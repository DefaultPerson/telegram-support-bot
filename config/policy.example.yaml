# Example policy for the optional declarative engine.
#
# Enable it by setting in .env:
#   POLICY_ENABLED=true
#   POLICY_CONFIG_PATH=config/policy.yaml
# Or supply it base64-encoded via POLICY_YAML_B64 (handy on compose platforms).
#
# With POLICY_ENABLED=false (default) the engine is a no-op.

version: 1

defaults:
  language_fallback: en
  # true: auto_reply actions without their own `once` are sent to a user only once.
  auto_reply_once: false

variables:
  rules_url: "https://example.com/rules"

templates:
  rules_link:
    en: "Please read the rules first: {rules_url}"
    ru: "Пожалуйста, ознакомьтесь с правилами: {rules_url}"
  received:
    en: "Thanks, your message has reached us. We will answer as soon as we can; no need to write again."
    ru: "Спасибо, сообщение получено. Ответим, как только сможем, писать повторно не нужно."

# Rules are evaluated top-to-bottom; actions of every matching rule are applied.
#
# Matchers (inside `when`):
#   event_type:     user_message | user_started | user_stopped | topic_created
#   keywords_any:   list of substrings, or {min_matches: N, list: [...]}
#   regex:          a regular expression tested against the message text
#   message_length: {min: N, max: N}
#   has_link:       true|false
#   first_message:  true|false  (true only for the user's very first message;
#                   one dropped by suppress_topic_creation does not count)
#   all: [...] / any: [...]
#
# Actions:
#   suppress_topic_creation, suppress_group_notify, auto_reply (template_key),
#   close_topic, escalate
#
# auto_reply options:
#   once:           true sends the template to a user only once (default:
#                   defaults.auto_reply_once)
#   suppress_draft: false keeps the LLM draft for this message; by default any
#                   auto-reply counts as an answer and skips the draft
rules:
  - id: skip_lifecycle
    when:
      event_type: [user_started, user_stopped]
    actions:
      - type: suppress_group_notify

  - id: price_question
    when:
      any:
        - regex: "(?i)\\b(price|cost|how much)\\b"
    actions:
      - type: auto_reply
        template_key: rules_link
        once: true

  # A "message received" notice after the first message; the manager still
  # gets an AI draft for it.
  - id: first_message_notice
    when:
      event_type: user_message
      first_message: true
    actions:
      - type: auto_reply
        template_key: received
        suppress_draft: false

# Optional LLM layer. Real on/off switch is the AI_PROVIDER env var.
# When enabled, the bot drafts a reply (based on the conversation so far) and
# posts it into the topic with Send/Skip buttons for the manager.
ai:
  enabled: false
  system_prompt_path: config/system_prompt.txt
  max_context_messages: 12
  # Record every draft and what became of it (sent, skipped, manager_replied,
  # superseded, auto_sent) for the /ai_stats admin command.
  log_drafts: false
  # Classify the user's first message into one of these categories with a
  # separate short LLM request. Empty (the default): no classification.
  #   key:           short id (up to 40 characters); an unclear answer maps to
  #                  "other" when such a key exists, otherwise to no category
  #   icon:          put before the topic name
  #   needs_human:   automatic replies can never be turned on for it
  #   notify_admins: message every admin in BOT_DEV_IDS with a link to the topic
  categories: []
  # categories:
  #   - key: billing
  #     title: Billing and payments
  #     icon: "💳"
  #   - key: bug
  #     title: Bug report
  #     icon: "🐞"
  #   - key: account
  #     title: Account access or security
  #     icon: "🔐"
  #     needs_human: true
  #     notify_admins: true
  #   - key: other
  #     title: Anything else
  # /ai_auto warns before turning automatic replies on for a category whose
  # share of sent drafts is below auto_threshold or which has fewer reviewed
  # drafts than auto_min_drafts. The admin can still confirm.
  auto_threshold: 0.95
  auto_min_drafts: 20
